<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | BitBuzz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="description" content="There is no page at this address on BitBuzz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000000;
    --ink:#EDEBE5;
    --mute:#76746F;
    --amber:#FFC24A;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--void);
    color:var(--ink);
    font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
    font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(24px,6vw,56px);
    overflow-x:hidden;
  }

  .astro{
    width:clamp(150px,34vw,260px);
    height:auto;
    display:block;
    margin-bottom:clamp(-6px,-1vw,0px);
  }

  .code{
    font-size:clamp(6.5rem,30vw,17rem);
    font-weight:800;
    letter-spacing:-.05em;
    line-height:.8;
    margin:clamp(8px,2vw,18px) 0 clamp(18px,4vw,28px);
  }

  .label{
    font-size:clamp(.95rem,3.4vw,1.35rem);
    font-weight:700;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--ink);
  }

  .quip{
    margin-top:clamp(20px,4vw,28px);
    font-size:clamp(1rem,2.6vw,1.14rem);
    font-weight:500;
    color:var(--ink);
    max-width:28rem;
    line-height:1.5;
  }

  .sub{
    margin-top:10px;
    font-size:clamp(.9rem,2.3vw,1rem);
    color:var(--mute);
  }

  .home{
    margin-top:clamp(30px,6vw,44px);
    font-size:.95rem;
    font-weight:500;
    color:var(--amber);
    text-decoration:none;
    border-bottom:1px solid rgba(255,194,74,.32);
    padding-bottom:3px;
    transition:border-color .18s ease;
  }

  .home:hover{border-color:var(--amber)}

  .home:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:4px;
    border-color:transparent;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>

<body>

  <img
    class="astro"
    src="https://cdn.hackclub.com/01a091b9-6474-7afa-ad3d-0fe63d0d3bc4/c2e16afc6bff5a5ec0f027f1cc209649.gif"
    alt="Astronaut dancing in space"
  >

  <div class="code">404</div>

  <p class="label">PAGE NOT FOUND</p>

  <p class="quip">Congrats, you landed on an Alien Page lol</p>
  <p class="sub">Probably a typo</p>

  <a class="home" href="/">Back to BitBuzz</a>

</body>
</html>
