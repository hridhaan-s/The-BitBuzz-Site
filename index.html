<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F5" />

    <link rel="icon" type="image/jpeg" href="https://cdn.hackclub.com/019eb6cc-8925-7919-8d68-9add6a3d295f/bitbuzz_kids_logo.jpg" />
    <link rel="apple-touch-icon" href="https://cdn.hackclub.com/019eb6cc-8925-7919-8d68-9add6a3d295f/bitbuzz_kids_logo.jpg" />

    <title>BitBuzz — Stop eating noise.</title>
    <style>
      /* Landing-page navigation: Explore and Opportunities are retired. */
      .bb .bb-navlink:nth-child(2),
      .bb .bb-navlink:nth-child(4),
      .bb nav[aria-label="Mobile"] > a:nth-child(2),
      .bb nav[aria-label="Mobile"] > a:nth-child(4) {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        const saved = localStorage.getItem('bitbuzz_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved === 'dark' || (saved !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
