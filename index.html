    <title>BitBuzz — Student newsroom</title>
    <style>
      .bb .bb-navlink:nth-child(2),.bb .bb-navlink:nth-child(4),.bb nav[aria-label="Mobile"] > a:nth-child(2),.bb nav[aria-label="Mobile"] > a:nth-child(4){display:none!important;}
    </style>
    <script>(function(){const saved=localStorage.getItem('bitbuzz_theme');const systemDark=window.matchMedia('(prefers-color-scheme: dark)').matches;const theme=saved==='dark'||(saved!=='light'&&systemDark)?'dark':'light';document.documentElement.setAttribute('data-theme',theme);})();</script>
